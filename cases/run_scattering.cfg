# ============================================================
# PEEC: harmonic scattering
#
# Both short and long option names are accepted by config.c.
# ============================================================

--task scattering
--physics quasistatic

--mesh meshes/body_closed.msh

--frequency 1e6
--field-amplitude 1.0

# Incident-wave direction [deg]
--theta 90
--phi 0

# Initial phase [rad]
--phase 0

# horizontal | vertical
--polarization horizontal

--parallel 12

--save-matrices
--matrix-dir results/SCATTERING/matrices

--vtk
--vtk-dir results/SCATTERING
