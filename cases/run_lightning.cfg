# ============================================================
# PEEC run configuration
#
# Same option names as the command line.
# Empty lines and lines beginning with # are ignored.
# ============================================================

--task lightning
--lightning-case two-stage
--excitation lightning-current

--closed-mesh meshes/body_closed.msh
--open-mesh meshes/body_open.msh
--aperture-map cases/aperture_map.json

--dt 1e-7
--t-end 1e-4
--time-order 1

--strike-node 950
--return-node 652

--lightning-K 102900
--lightning-alpha 1500
--lightning-beta 1000000
--lightning-delay 0

--shunt-R 1000
--shunt-a-node 996
--shunt-b-node 721

--parallel 12

--save-matrices
--vtk
--vtk-dir results/TEST
--vtk-every 1
