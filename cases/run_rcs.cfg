# ============================================================
# PEEC: bistatic angular RCS sweep (fixed incident direction)
#
# Frequency is obtained in main.c from
#
#     k a = ka
#     k   = ka / a
#     f   = c k / (2 pi)
#
# Both short and long option names are accepted by config.c.
# ============================================================

--task rcs
--physics quasistatic

--mesh meshes/body_closed.msh

# Electrical size ka and characteristic dimension a [m]
# For this 7 m body, ka=1 with a=1 gives kD=7; QS is inaccurate.
# Use a small electrical size for this quasistatic example.
--ka 0.02
--characteristic-length 1.0

--field-amplitude 1.0

# Incident-wave direction [deg]
--theta 90
--phi 0

# Initial phase [rad]
--phase 0

# horizontal | vertical
--polarization horizontal

# Observation sweep
--rcs-observation-theta 90
--rcs-phi-start 0
--rcs-phi-end 360
--rcs-phi-step 1

# Surface-current integration settings
--rcs-use-dual
--rcs-order 4

--output results/RCS/rcs.csv

--parallel 12

--save-matrices
--matrix-dir results/RCS/matrices

--vtk
--vtk-dir results/RCS
