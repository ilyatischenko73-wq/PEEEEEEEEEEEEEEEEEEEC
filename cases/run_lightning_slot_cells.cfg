# ============================================================
# PEEC / one-stage distributed slot-cell lightning model
# ============================================================

--task lightning
--physics quasistatic

--lightning-case slot-cells
--excitation lightning-current

# ONE physical mesh: body with the real aperture.
--open-mesh meshes/body_open.msh

# Distributed equivalent cells across the aperture.
--slot-cells cases/slot_cells.dat

# Geometry used by the coplanar-strip aperture approximation.
#
# IMPORTANT:
# Replace these three numbers with the actual geometry.
--slot-width 0.10
--slot-wall-span 2.00
--slot-wall-thickness 0.002

--slot-epsilon-r 1.0
--slot-mu-r 1.0

--dt 1e-7
--t-end 1e-4
--time-order 1

# IMPORTANT:
# These indices belong to body_open.msh.
# Re-pick them with V_exact_c_indices.py if necessary.
--strike-node 950
--return-node 652

--lightning-K 102900
--lightning-alpha 1500
--lightning-beta 1000000
--lightning-delay 0

# Optional internal resistive load.
--shunt-R 1000
--shunt-a-node 996
--shunt-b-node 721

--parallel 12

--save-matrices
--matrix-dir results/SLOT_CELLS/matrices

--vtk
--vtk-dir results/SLOT_CELLS
--vtk-every 1
